upstream app {
    server app:8000;
}

server {
    listen 80;
    server_name test-booking.dreww.dev;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name test-booking.dreww.dev;

    ssl_certificate     /etc/letsencrypt/live/test-booking.dreww.dev/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/test-booking.dreww.dev/privkey.pem;

    client_max_body_size 10M;

    location /static/ {
        alias /app/staticfiles/;
    }

    location /media/ {
        alias /app/media/;
    }

    location / {
        proxy_pass http://app;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
