services:
  redis:
    image: redis:alpine
    container_name: redis-main
    command: redis-server --protected-mode no
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  app:
    image: ghcr.io/03-andrew/refactor-kawaiiapi:latest
    build:
      context: .
      dockerfile: Dockerfile
    container_name: kawaiiapi-app
    restart: always
    volumes:
      - .:/app
      - staticfiles:/app/staticfiles
    command: >
      sh -c "python manage.py collectstatic --noinput &&
             python manage.py migrate --noinput &&
             daphne -p 8000 -b 0.0.0.0 kawaiiAPI.asgi:application"
    depends_on:
      redis:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DEBUG: "${DEBUG:-False}"
      SECRET_KEY: "${SECRET_KEY:-django-insecure-key}"
      DATABASE_URL: "${DATABASE_URL}"
      REDIS_HOST: "redis"
      REDIS_PORT: "6379"
      REDIS_URL: "redis://redis:6379/1"
      CELERY_BROKER_URL: "redis://redis:6379/2"

  celery:
    image: ghcr.io/03-andrew/refactor-kawaiiapi:latest
    build:
      context: .
      dockerfile: Dockerfile
    container_name: kawaiiapi-celery
    restart: always
    volumes:
      - .:/app
    command: celery -A kawaiiAPI worker -l info
    depends_on:
      redis:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DEBUG: "${DEBUG:-False}"
      SECRET_KEY: "${SECRET_KEY:-django-insecure-key}"
      DATABASE_URL: "${DATABASE_URL}"
      REDIS_HOST: "redis"
      REDIS_PORT: "6379"
      REDIS_URL: "redis://redis:6379/1"
      CELERY_BROKER_URL: "redis://redis:6379/2"

  nginx:
    image: nginx:alpine
    container_name: kawaiiapi-nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - staticfiles:/app/staticfiles:ro
      - certbot_www:/var/www/certbot:ro
      - certbot_conf:/etc/letsencrypt:ro
    depends_on:
      - app

  certbot:
    image: certbot/certbot
    container_name: kawaiiapi-certbot
    volumes:
      - certbot_www:/var/www/certbot
      - certbot_conf:/etc/letsencrypt
    entrypoint: >
      sh -c "trap exit TERM; while :; do certbot renew; sleep 12h; done"
    depends_on:
      - nginx

volumes:
  staticfiles:
  certbot_www:
  certbot_conf:
