services:
  redis:
    image: redis:alpine
    container_name: redis-main
    command: redis-server --protected-mode no
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  app:
    image: ghcr.io/03-andrew/refactor-kawaiiapi:latest
    build:
      context: .
      dockerfile: Dockerfile
    container_name: kawaiiapi-app
    restart: always
    volumes:
      - staticfiles:/app/staticfiles
    command: >
      sh -c "DJANGO_SETTINGS_MODULE=kawaiiAPI.settings.prod python manage.py collectstatic --noinput &&
             DJANGO_SETTINGS_MODULE=kawaiiAPI.settings.prod python manage.py migrate --noinput &&
             DJANGO_SETTINGS_MODULE=kawaiiAPI.settings.prod python manage.py seed_data &&
             gunicorn kawaiiAPI.wsgi:application --bind 0.0.0.0:8000"
    depends_on:
      redis:
        condition: service_healthy
    env_file:
      - .env

  celery:
    image: ghcr.io/03-andrew/refactor-kawaiiapi:latest
    build:
      context: .
      dockerfile: Dockerfile
    container_name: kawaiiapi-celery
    restart: always
    command: celery -A kawaiiAPI worker -l info
    depends_on:
      redis:
        condition: service_healthy
    env_file:
      - .env

  nginx:
    image: nginx:alpine
    container_name: kawaiiapi-nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    environment:
      - DOMAIN=${DOMAIN:-test-booking.dreww.space}
    volumes:
      - ./nginx/conf.d:/nginx-templates:ro
      - ./nginx/docker-entrypoint.sh:/docker-entrypoint.sh:ro
      - staticfiles:/app/staticfiles:ro
      - certbot_www:/var/www/certbot:ro
      - certbot_conf:/etc/letsencrypt:ro
    entrypoint: ["sh", "/docker-entrypoint.sh"]
    depends_on:
      - app

  certbot:
    image: certbot/certbot
    container_name: kawaiiapi-certbot
    volumes:
      - certbot_www:/var/www/certbot
      - certbot_conf:/etc/letsencrypt
    entrypoint: >
      sh -c "
      if [ ! -f /etc/letsencrypt/live/${DOMAIN:-test-booking.dreww.space}/fullchain.pem ]; then
        certbot certonly --webroot -w /var/www/certbot -d ${DOMAIN:-test-booking.dreww.space} --email ${CERTBOT_EMAIL} --agree-tos --no-eff-email;
      fi;
      trap exit TERM;
      while :; do certbot renew; sleep 12h; done"
    depends_on:
      - nginx
volumes:
  staticfiles:
  certbot_www:
  certbot_conf:
